<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>沐曜 AI 客服系統</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f5f5f5;color:#333;line-height:1.6}
  .wrap{max-width:920px;margin:0 auto;padding:20px}
  button{padding:9px 16px;border-radius:8px;font-size:14px;cursor:pointer;border:1px solid #ddd;background:#fff;font-family:inherit}
  button:hover{background:#f5f5f5}
  button.primary{background:#534AB7;color:#fff;border-color:#534AB7}
  button.primary:hover{background:#3C3489}
  button.mini{padding:6px 12px;font-size:13px}
  /* 登入 */
  .login{max-width:360px;margin:10vh auto;background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:28px}
  .login h1{font-size:20px;margin-bottom:4px}
  .login .s{font-size:13px;color:#888;margin-bottom:20px}
  .login label{font-size:12px;color:#888;display:block;margin:12px 0 4px}
  .login input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit}
  .login input:focus{outline:none;border-color:#7F77DD}
  .login button{width:100%;margin-top:18px}
  .err{color:#A32D2D;font-size:13px;margin-top:10px;min-height:18px}
  /* 後台 */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .brand{font-size:18px;font-weight:500}
  .brand .s{font-size:12px;color:#888;font-weight:400}
  .user-box{display:flex;align-items:center;gap:10px;font-size:13px}
  .avatar{width:30px;height:30px;border-radius:50%;background:#CECBF6;color:#26215C;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:#fff;border-radius:8px;padding:14px 16px;border:1px solid #eee}
  .stat .l{font-size:12px;color:#888}
  .stat .v{font-size:24px;font-weight:500;margin-top:4px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .tab{font-size:13px;padding:6px 13px;border-radius:999px;border:1px solid #ddd;color:#666;cursor:pointer;background:#fff}
  .tab.on{background:#534AB7;color:#fff;border-color:#534AB7}
  .row{background:#fff;border:1px solid #eee;border-radius:10px;padding:14px 16px;margin-bottom:10px}
  .row.warn{background:#fffaf0;border-color:#fae0b0}
  .row-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .shop{font-size:12px;padding:2px 8px;border-radius:6px;background:#f1efe8;color:#5f5e5a}
  .buyer{font-size:12px;padding:2px 8px;border-radius:6px;background:#E6F1FB;color:#185FA5}
  .copy{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer}
  .copy:hover{background:#f0edff;border-color:#7F77DD}
  .copy.copied{background:#E1F5EE;color:#0F6E56;border-color:#9FE1CB}
  .q{font-size:14px;color:#333}
  .meta{display:flex;align-items:center;gap:10px}
  .time{font-size:12px;color:#aaa}
  .st{font-size:12px;padding:3px 9px;border-radius:999px}
  .st.auto_sent,.st.auto_holding{background:#E1F5EE;color:#0F6E56}
  .st.pending{background:#FAC775;color:#633806}
  .st.handling{background:#E6F1FB;color:#185FA5;display:inline-flex;align-items:center;gap:4px}
  .st.approved_to_send{background:#FDEFD3;color:#8A5A00}
  .st.done{background:#EAF3DE;color:#3B6D11}
  .ans{font-size:13px;color:#777;margin-top:7px}
  .cnt{font-size:11px;padding:2px 8px;border-radius:999px;background:#EDE9FB;color:#534AB7;font-weight:500}
  .latest-line{margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .toggle{font-size:12px;padding:3px 10px;border-radius:6px;border:1px solid #ddd;background:#fafafa;color:#666;cursor:pointer}
  .toggle:hover{background:#f0edff;border-color:#7F77DD;color:#534AB7}
  .bubbles{margin-top:10px;border-top:1px dashed #eee;padding-top:10px;display:flex;flex-direction:column;gap:7px}
  .bubble{display:flex;gap:10px;align-items:baseline;font-size:14px}
  .bubble .btime{font-size:11px;color:#aaa;flex-shrink:0;min-width:78px}
  .bubble .btext{color:#333}
  .bubble.reply-bubble .btext{color:#0F6E56;background:#eafaf3;padding:4px 10px;border-radius:8px}
  .bubble.reply-bubble .btime{color:#0F6E56}
  .reply-wrap{margin-top:10px;background:#f7f5ff;border:1px solid #e0daf5;border-radius:8px;padding:10px 12px}
  .reply-lbl{font-size:12px;color:#534AB7;font-weight:500;margin-bottom:6px}
  .reply{width:100%;min-height:150px;padding:11px 13px;border:1px solid #ccc;border-radius:6px;font-size:15px;font-family:inherit;line-height:1.7;resize:vertical;background:#fff}
  .reply:focus{outline:none;border-color:#7F77DD}
  .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;color:#aaa;font-size:12px;align-items:center}
  .loading{text-align:center;color:#aaa;padding:40px}
  /* 自動送出狀態/設定 */
  .as-badge{font-size:12px;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:1px solid transparent}
  .as-badge.on{background:#E1F5EE;color:#0F6E56}
  .as-badge.off{background:#f1efe8;color:#5f5e5a}
  .as-badge.paused{background:#FBE7E7;color:#A32D2D}
  .as-badge.warn{background:#FDEFD3;color:#8A5A00}
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:#fff;border-radius:12px;padding:22px 24px;width:360px;max-width:92vw}
  .modal h2{font-size:16px;margin-bottom:14px}
  .modal label{font-size:12px;color:#888;display:block;margin:12px 0 4px}
  .modal input[type=time]{padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit}
  .modal .row2{display:flex;align-items:center;gap:10px}
  .modal .chk-row{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px}
  .modal .pause-row{margin-top:16px;padding-top:14px;border-top:1px solid #eee}
  .modal .foot-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
  /* FAQ 管理 */
  .faq-search{width:100%;padding:9px 11px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:14px}
  .faq-search:focus{outline:none;border-color:#7F77DD}
  .faq-card{border-left:4px solid #CECBF6}
  .faq-card .top{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
  .faq-card .cat{width:130px;padding:8px 10px;border:1px solid #ddd;border-radius:7px;font-size:13px;font-family:inherit}
  .faq-card label{font-size:12px;color:#888;display:block;margin:8px 0 3px}
  .faq-card textarea{width:100%;padding:9px 11px;border:1px solid #ddd;border-radius:7px;font-size:14px;font-family:inherit;line-height:1.6;resize:vertical}
  .faq-card textarea:focus{outline:none;border-color:#7F77DD}
  .faq-card .qbox{min-height:64px}
  .faq-card .abox{min-height:90px}
  .faq-card .row-btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
  .faq-saved{color:#0F6E56;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <!-- 登入 -->
  <div id="loginView">
    <div class="login">
      <h1>沐曜 AI 客服系統</h1>
      <div class="s">請用您的 Email 與密碼登入</div>
      <label>Email</label>
      <input id="email" type="email" placeholder="you@muyo.com.tw" onkeydown="if(event.key==='Enter')doLogin()">
      <label>密碼</label>
      <input id="pw" type="password" placeholder="密碼" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="primary" id="loginBtn" onclick="doLogin()">登入</button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>

  <!-- 後台 -->
  <div id="appView" style="display:none">
    <div class="topbar">
      <div class="brand">沐曜 AI 客服系統 <span class="s">· 24 小時雲端運作</span></div>
      <div class="user-box">
        <span class="as-badge off" id="asBadge" onclick="openAutosendModal()">⚪ 載入中…</span>
        <button class="mini" onclick="switchView('faq')">📚 FAQ 管理</button>
        <span class="avatar" id="avatar">?</span>
        <span>登入中:<b id="curUser">-</b></span>
        <button class="mini" onclick="loadAll()">重新整理</button>
        <span id="autoDot" style="font-size:12px;color:#0F6E56">● 自動更新中</span>
        <button class="mini" onclick="doLogout()">登出</button>
      </div>
    </div>
    <div id="convView">
      <div class="stats" id="stats"></div>
      <div class="tabs" id="tabs"></div>
      <div class="tabs" id="replyTabs" style="margin-top:6px"></div>
      <div id="list"><div class="loading">載入中…</div></div>
      <div class="foot" id="foot"></div>
    </div>

    <!-- FAQ 管理 -->
    <div id="faqView" style="display:none">
      <div class="topbar">
        <span class="badge" id="faqCount">0 筆</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="mini primary" onclick="addNewFaq()">＋ 新增 FAQ</button>
          <button class="mini" onclick="loadFaqs()">重新整理</button>
          <button class="mini" onclick="switchView('conv')">← 返回對話列表</button>
        </div>
      </div>
      <input class="faq-search" id="faqSearch" placeholder="🔍 搜尋(分類、問法或答案關鍵字)" oninput="renderFaqList()">
      <div id="faqList"></div>
    </div>
  </div>

  <!-- 自動送出排程設定 -->
  <div id="autosendModal" class="modal-mask" style="display:none" onclick="if(event.target===this)closeAutosendModal()">
    <div class="modal">
      <h2>⚙️ 自動送出排程設定</h2>
      <div style="font-size:12px;color:#888">點「送出給客人」核准後,實際送出的動作交給你電腦上跑的自動化腳本,依這裡設定的時段運作。</div>

      <label>平日(週一~週五)自動運作時段</label>
      <div class="row2">
        <input type="time" id="asWeekdayStart">
        <span style="color:#aaa">～(隔天)</span>
        <input type="time" id="asWeekdayEnd">
      </div>
      <div style="font-size:11px;color:#aaa;margin-top:4px">例如 18:00～09:00,代表平日晚上到隔天早上自動運作,白天客服上班時段不運作。</div>

      <div class="chk-row">
        <input type="checkbox" id="asWeekendActive">
        <label style="margin:0" for="asWeekendActive">六日全天自動運作</label>
      </div>

      <div class="pause-row">
        <label style="margin-top:0">緊急總開關</label>
        <button class="mini" id="asPauseBtn" style="width:100%" onclick="toggleManualPause()">—</button>
        <div style="font-size:11px;color:#aaa;margin-top:6px">開啟後,不管排程設定,自動送出一律暫停,核准的內容會留在佇列裡等你恢復。</div>
      </div>

      <div class="pause-row">
        <label style="margin-top:0">AI 生成草稿設定</label>
        <div style="font-size:11px;color:#aaa;margin-bottom:8px">選擇要用哪家 AI 生成回覆草稿,金鑰要自己去該平台申請、自己開通付費,不會經過我們。</div>
        <select id="aiProvider" onchange="updateAiApplyLink()" style="width:100%;padding:9px 11px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit">
          <option value="openai">OpenAI(GPT)</option>
          <option value="gemini">Google Gemini</option>
        </select>
        <label>API 金鑰</label>
        <input type="password" id="aiApiKey" placeholder="貼上你自己申請的 API 金鑰" style="width:100%;padding:9px 11px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit">
        <div style="font-size:11px;color:#aaa;margin-top:6px" id="aiApplyLink"></div>
      </div>

      <div class="foot-btns">
        <button class="mini" onclick="closeAutosendModal()">關閉</button>
        <button class="mini primary" onclick="saveAutosendSettings()">儲存設定</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== 連到你的 Supabase =====
const SUPABASE_URL = 'https://jwuuxsapnghzxmslyafp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dhUdtJyzK1sdUudxtZMYyg_mYWC12h1';
const BACKEND = 'https://muyo-cs-backend.vercel.app';   // 後端(送訊 API)
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let me = null;          // {id, name, role, company_id}
let shops = [];
let staffMap = {};      // id -> name
let autosendSettings = null;  // autosend_settings 那一列(排程/暫停/心跳)
let msgs = [];
let convs = [];               // 分組後的對話陣列
let expandedConvs = {};       // 記住哪些對話被展開(點開看全部)
let currentShop = '全部';
let statusFilter = null;     // 點「待處理對話」統計卡時設成 'pending',只看待處理的對話
let replyFilter = '';        // ''=全部, 'replied'=已回覆, 'unreplied'=未回覆
let autoTimer = null;        // 自動刷新計時器
const AUTO_SECONDS = 15;     // 每幾秒自動刷新一次
let faqs = [];                // FAQ 管理分頁的資料
let currentView = 'conv';     // 'conv'(對話列表) 或 'faq'(FAQ 管理)

function esc(t){ const d=document.createElement('div'); d.textContent=t==null?'':t; return d.innerHTML; }

// ---------- 登入 ----------
async function doLogin(){
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('pw').value;
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  errEl.textContent=''; btn.disabled=true; btn.textContent='登入中…';
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  btn.disabled=false; btn.textContent='登入';
  if(error){ errEl.textContent = '登入失敗:' + (error.message.includes('Invalid')?'帳號或密碼錯誤':error.message); return; }
  await afterLogin();
}
async function doLogout(){ stopAutoRefresh(); await sb.auth.signOut(); me=null; showLogin(); }
function showLogin(){ document.getElementById('appView').style.display='none'; document.getElementById('loginView').style.display='block'; }
function showApp(){ document.getElementById('loginView').style.display='none'; document.getElementById('appView').style.display='block'; }

async function afterLogin(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user){ showLogin(); return; }
  const { data: staff, error } = await sb.from('staff').select('*').eq('id', user.id).single();
  if(error || !staff){
    document.getElementById('loginErr').textContent = '這個帳號還沒被加入客服成員,請管理者先設定。';
    await sb.auth.signOut(); showLogin(); return;
  }
  me = { id:user.id, name:staff.name, role:staff.role, company_id:staff.company_id };
  showApp();
  await loadAll();
  startAutoRefresh();     // 登入後開始每 15 秒自動刷新
}

// ---------- 自動刷新 ----------
// 判斷使用者是不是正在打字回覆(游標停在某個回覆框裡),
// 如果是,就先跳過這次自動刷新,免得把打到一半的內容洗掉。
function isTyping(){
  const el = document.activeElement;
  return el && el.classList && el.classList.contains('reply');
}
// 是不是有對話正被展開查看中(點了「展開全部」),如果是,自動刷新會把畫面重繪、
// 使用者要重新捲動/重新點開才看得到,體感上就像被「收合」了一樣 —— 先跳過這次自動刷新。
function hasExpandedConv(){
  return Object.values(expandedConvs).some(v => v);
}
function startAutoRefresh(){
  stopAutoRefresh();
  autoTimer = setInterval(()=>{
    if(!me) return;              // 沒登入就不刷
    if(document.hidden) return;  // 分頁在背景就不刷(省流量)
    if(isTyping()) return;       // 正在打字就不刷(保護內容)
    if(hasExpandedConv()) return; // 有對話正被展開查看中,先不要打斷
    loadAll();
  }, AUTO_SECONDS * 1000);
}
function stopAutoRefresh(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
}

// ---------- 載入資料 ----------
async function loadAll(){
  if(!me) return;
  document.getElementById('curUser').textContent = me.name;
  document.getElementById('avatar').textContent = me.name.charAt(0);
  document.getElementById('list').innerHTML = '<div class="loading">載入中…</div>';

  const [{ data: shopRows }, { data: staffRows }, { data: msgRows }, { data: asRows }] = await Promise.all([
    sb.from('shops').select('*').eq('company_id', me.company_id).order('name'),
    sb.from('staff').select('id,name').eq('company_id', me.company_id),
    sb.from('messages').select('*').eq('company_id', me.company_id).order('received_at', { ascending:false }).limit(200),
    sb.from('autosend_settings').select('*').eq('company_id', me.company_id).limit(1),
  ]);
  shops = shopRows || [];
  staffMap = {}; (staffRows||[]).forEach(s=>staffMap[s.id]=s.name);
  msgs = msgRows || [];
  convs = groupIntoConversations(msgs);
  autosendSettings = (asRows && asRows[0]) || null;
  render();
  renderAutosendBadge();
}

// ============================================================
//  把「單筆訊息」依 conversation_id + 12 小時規則,合併成「對話」
//  規則(佳芬 7/7 定):
//   - 同一個 conversation_id,相鄰訊息間隔 <= 12 小時 → 同一段對話
//   - 間隔 > 12 小時 → 拆成新的一段對話
//   - 沒有 conversation_id 的,用 買家+賣場 當備援分組鍵
// ============================================================
const GAP_HOURS = 12;
function groupIntoConversations(list){
  // msgs 已是 received_at 由新到舊;先複製一份由「舊到新」方便分段
  const asc = [...list].sort((a,b)=> new Date(a.received_at) - new Date(b.received_at));
  const buckets = {};   // key -> 該對話鍵目前累積的訊息
  const result = [];

  for(const m of asc){
    const convKey = m.conversation_id || `nk_${m.shop_id}_${m.buyer_id||m.buyer_name||'?'}`;
    const groupKey = `${m.shop_id}__${convKey}`;
    const prev = buckets[groupKey];
    let openConv = prev && prev._open;

    // 若與上一則間隔超過 12 小時 → 視為新對話
    if(openConv){
      const gapMs = new Date(m.received_at) - new Date(openConv.lastAt);
      if(gapMs > GAP_HOURS*3600*1000){ openConv = null; }
    }
    if(!openConv){
      openConv = {
        key: groupKey + '__' + m.received_at,   // 這一「段」的唯一鍵
        convId: m.conversation_id || null,
        shop_id: m.shop_id,
        buyer_id: m.buyer_id,
        buyer_name: m.buyer_name,
        items: [],
        lastAt: m.received_at,
      };
      result.push(openConv);
      buckets[groupKey] = { _open: openConv };
    }
    openConv.items.push(m);
    openConv.lastAt = m.received_at;
  }

  // 每段對話:算出「顯示狀態」「最新訊息」「最後時間」,並依最後時間新到舊排序
  for(const c of result){
    c.items.sort((a,b)=> new Date(a.received_at) - new Date(b.received_at)); // 段內舊到新
    c.latest = c.items[c.items.length-1];
    c.firstAt = c.items[0].received_at;
    c.lastAt = c.latest.received_at;
    c.count = c.items.length;
    c.status = convStatus(c);           // 整段對話的狀態(見下)
    c.handler_id = pickHandler(c);      // 誰在處理/誰回的
    c.reply_text = lastReplyText(c);    // 若已回覆,最後一則回覆內容
    c.ai_draft = c.latest.ai_draft || '';
  }
  result.sort((a,b)=> new Date(b.lastAt) - new Date(a.lastAt));  // 對話新到舊
  return result;
}

// 整段對話的狀態:只要有任何一筆「待處理」→ 整段待處理(要提醒);
// 否則若有人正在處理 → 處理中;全部回覆完 → 依 AI/人工顯示已回覆/已自動回覆。
function convStatus(c){
  const ss = c.items.map(m=>m.status);
  if(ss.includes('pending')) return 'pending';
  if(ss.includes('handling')) return 'handling';
  if(ss.includes('approved_to_send')) return 'approved_to_send';
  if(ss.every(s=> s==='auto_sent' || s==='auto_holding')) return 'auto_sent';
  if(ss.includes('done')) return 'done';
  return c.latest.status;
}
function pickHandler(c){
  // 取最後一筆有 handler 的
  for(let i=c.items.length-1;i>=0;i--){ if(c.items[i].handler_id) return c.items[i].handler_id; }
  return null;
}
function lastReplyText(c){
  for(let i=c.items.length-1;i>=0;i--){ if(c.items[i].reply_text) return c.items[i].reply_text; }
  return null;
}

function shopName(id){ const s=shops.find(x=>x.id===id); return s?s.name:'—'; }

function render(){
  // 統計(以對話為單位)
  const today = new Date().toISOString().slice(0,10);
  const autoToday = convs.filter(c=>c.status==='auto_sent' && (c.lastAt||'').slice(0,10)===today).length;
  const pending = convs.filter(c=>c.status==='pending').length;
  document.getElementById('stats').innerHTML =
    stat('今日 AI 自動回覆', autoToday) +
    stat('待處理對話', pending, pending>0?'#BA7517':'', 'togglePendingFilter()', statusFilter==='pending') +
    stat('連線賣場', shops.length) +
    stat('客服成員', Object.keys(staffMap).length);

  // 賣場分頁(數字改成對話數)
  let tabs = tab('全部', convs.length);
  shops.forEach(s=>{ tabs += tab(s.name, convs.filter(c=>c.shop_id===s.id).length, s.id); });
  if(statusFilter==='pending'){ tabs += `<span class="tab on" style="background:#BA7517;border-color:#BA7517" onclick="togglePendingFilter()">✕ 只看待處理</span>`; }
  document.getElementById('tabs').innerHTML = tabs;

  // 已回覆/未回覆分頁(以目前賣場篩選後的對話為基準計算數字)
  const shopScoped = currentShop==='全部' ? convs : convs.filter(c=>c.shop_id===currentShop);
  const repliedCount = shopScoped.filter(c=>isReplied(c.status)).length;
  const unrepliedCount = shopScoped.length - repliedCount;
  document.getElementById('replyTabs').innerHTML =
    replyTab('全部', shopScoped.length, '') +
    replyTab('未回覆', unrepliedCount, 'unreplied') +
    replyTab('已回覆', repliedCount, 'replied');

  // 對話列表
  let list = convs;
  if(currentShop!=='全部'){ list = convs.filter(c=>c.shop_id===currentShop); }
  if(statusFilter==='pending'){ list = list.filter(c=>c.status==='pending'); }
  if(replyFilter==='replied'){ list = list.filter(c=>isReplied(c.status)); }
  if(replyFilter==='unreplied'){ list = list.filter(c=>!isReplied(c.status)); }
  const emptyMsg = statusFilter==='pending' ? '目前沒有待處理的對話 🎉' : (replyFilter==='unreplied' ? '目前沒有未回覆的對話 🎉' : (replyFilter==='replied' ? '目前沒有已回覆的對話' : '這裡目前沒有對話 ✨'));
  document.getElementById('list').innerHTML = list.length
    ? list.map(convHtml).join('')
    : `<div class="row" style="text-align:center;color:#aaa">${emptyMsg}</div>`;

  document.getElementById('foot').innerHTML = `資料即時存於雲端資料庫 · 每 ${AUTO_SECONDS} 秒自動更新(打字回覆或展開查看對話時會暫停,以免內容被洗掉/畫面被收合) · 同一客人 12 小時內的訊息會合併成一段對話。`;
}
function stat(l,v,color,onclick,active){
  const clickable = onclick ? `style="cursor:pointer;${active?'box-shadow:0 0 0 2px #BA7517 inset;':''}" onclick="${onclick}"` : '';
  return `<div class="stat" ${clickable}><div class="l">${l}</div><div class="v" style="color:${color||'#333'}">${v}</div></div>`;
}
function tab(name,n,id){ const key=id||name; const on=currentShop===key?'on':''; return `<span class="tab ${on}" onclick="selShop('${key}')">${esc(name)} ${n}</span>`; }
function togglePendingFilter(){ statusFilter = statusFilter==='pending' ? null : 'pending'; render(); }
function selShop(s){ currentShop=s; render(); }
function isReplied(status){ return status==='done' || status==='auto_sent'; }
function replyTab(name,n,key){ const on=replyFilter===key?'on':''; return `<span class="tab ${on}" onclick="selReplyFilter('${key}')">${esc(name)} ${n}</span>`; }
function selReplyFilter(key){ replyFilter=key; render(); }
function toggleConv(key){ expandedConvs[key]=!expandedConvs[key]; render(); }

function convHtml(c){
  const stLabel = {auto_sent:'已自動回覆', pending:'待處理', handling:'處理中', done:'已回覆'}[c.status]||c.status;
  let stHtml, acts='';

  if(c.status==='auto_sent'){ stHtml=`<span class="st auto_sent">已自動回覆</span>`; }
  else if(c.status==='done'){ stHtml=`<span class="st done">已回覆 · ${esc(staffMap[c.handler_id]||'')}</span>`; }
  else if(c.status==='approved_to_send'){
    stHtml=`<span class="st approved_to_send">⏳ 已核准,排隊自動送出中</span>`;
    acts=`<div class="acts" style="color:#aaa;font-size:13px;display:block">
      <div>已核准內容:「${esc(c.reply_text||'')}」</div>
      <div style="margin-top:4px">系統會在約 20~30 秒內自動送出給客人,不是立刻送出,請不用重複點擊。</div>
      <button class="mini" style="margin-top:6px" onclick="claim('${c.key}')">撤回改編輯</button>
    </div>`;
  }
  else if(c.status==='handling'){
    stHtml=`<span class="st handling">👤 ${esc(staffMap[c.handler_id]||'某人')} 處理中</span>`;
    if(c.handler_id===me.id){
      acts=`<div class="reply-wrap" id="reply-wrap-${c.key}">
        <div class="reply-lbl">✨ AI 幫你擬的草稿(可直接改,或自己重打):</div>
        <textarea class="reply" id="reply-${c.key}">${esc(c.ai_draft||'')}</textarea>
        <div class="acts">
          <button class="mini primary send-btn" onclick="sendReply('${c.key}', this)">送出給客人</button>
          <button class="mini" onclick="release('${c.key}')">放開(交給別人)</button>
        </div>
      </div>`;
    } else {
      acts=`<div class="acts" style="color:#aaa;font-size:13px">由 ${esc(staffMap[c.handler_id]||'其他同事')} 處理中</div>`;
    }
  } else { // pending
    stHtml=`<span class="st pending">待處理</span>`;
    acts=`<div class="acts"><button class="mini primary" onclick="claim('${c.key}')">我來處理</button></div>`;
  }

  // 對話裡的訊息:預設收起,只顯示最新一句;點「展開」看全部
  const isOpen = !!expandedConvs[c.key];
  const many = c.count > 1;
  let bubbles = '';
  if(isOpen){
    bubbles = c.items.map(m=>{
      const isReply = false;
      return `<div class="bubble">
        <span class="btime">${fmtTime(m.received_at)}</span>
        <span class="btext">${esc(m.customer_message)}</span>
      </div>`;
    }).join('');
    // 若已回覆,附上回覆內容
    if(c.reply_text){ bubbles += `<div class="bubble reply-bubble"><span class="btime">已回覆</span><span class="btext">${esc(c.reply_text)}</span></div>`; }
  }

  const toggleBtn = many
    ? `<button class="toggle" onclick="toggleConv('${c.key}')">${isOpen?'收起':`展開全部 ${c.count} 則`} ${isOpen?'▲':'▼'}</button>`
    : '';

  const warn = c.status==='pending'?'warn':'';
  const latestText = esc(c.latest.customer_message);

  return `<div class="row ${warn}">
    <div class="row-top">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="shop">${esc(shopName(c.shop_id))}</span>
        <span class="buyer">👤 ${esc(c.buyer_name||'買家')}</span>
        ${c.buyer_name?`<button class="copy" onclick="copyId('${esc(c.buyer_name)}',this)">複製帳號</button>`:''}
        ${many?`<span class="cnt">${c.count} 則</span>`:''}
      </div>
      <div class="meta"><span class="time">${fmtTime(c.lastAt)}</span>${stHtml}</div>
    </div>
    <div class="latest-line"><span class="q">${latestText}</span> ${toggleBtn}</div>
    ${isOpen?`<div class="bubbles">${bubbles}</div>`:''}
    ${(!isOpen && c.reply_text)?`<div class="ans">已回覆:「${esc(c.reply_text)}」</div>`:''}
    ${(!isOpen && c.status==='auto_sent' && c.ai_draft)?`<div class="ans">AI 回:${esc(c.ai_draft)}</div>`:''}
    ${acts}
  </div>`;
}
function fmtTime(t){ if(!t) return ''; const d=new Date(t); return d.toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }

// ---------- 動作(以「對話」為單位,寫回資料庫)----------
// 傳進來的是對話的 key;找出那段對話所有訊息的 id 一起更新。
function convByKey(key){ return convs.find(c=>c.key===key); }
function convMsgIds(c){ return c.items.map(m=>m.id); }

async function claim(key){
  const c = convByKey(key); if(!c) return;
  const ids = convMsgIds(c);
  const { error } = await sb.from('messages').update({ status:'handling', handler_id:me.id }).in('id', ids);
  if(error){ alert('操作失敗:'+error.message); return; }
  await loadAll();
}
async function release(key){
  const c = convByKey(key); if(!c) return;
  const ids = convMsgIds(c);
  const { error } = await sb.from('messages').update({ status:'pending', handler_id:null }).in('id', ids);
  if(error){ alert('操作失敗:'+error.message); return; }
  await loadAll();
}
// ★ 這個函式「不會」直接送到蝦皮 —— 蝦皮官方送訊 API 不開放給台灣開發者。
//   點下去只是把核准後的內容寫回資料庫、標記 status='approved_to_send',
//   真正送出的動作交給另一支獨立跑的瀏覽器自動化腳本輪詢處理。
async function sendReply(key, btn){
  const c = convByKey(key); if(!c) return;
  // 用 CSS.escape 讓含冒號/點的 key 也能安全查詢
  const box = document.getElementById('reply-'+key) || (btn && btn.closest('.reply-wrap')?.querySelector('.reply'));
  const text = (box?box.value:'').trim();
  if(!text){ alert('回覆內容不能空白'); return; }

  if(btn){ btn.disabled=true; btn.textContent='處理中…'; }

  const ids = convMsgIds(c);
  const lastId = c.latest.id;
  const r1 = await sb.from('messages').update({ status:'approved_to_send', handler_id:me.id }).in('id', ids);
  if(btn){ btn.disabled=false; btn.textContent='送出給客人'; }
  if(r1.error){ alert('核准失敗:'+r1.error.message); return; }
  const r2 = await sb.from('messages').update({ reply_text:text }).eq('id', lastId);
  if(r2.error){ alert('已核准,但記錄回覆內容失敗:'+r2.error.message); }
  await loadAll();
}

function copyId(text,btn){
  if(!text) return;
  const done=()=>{ const o=btn.textContent; btn.textContent='已複製 ✓'; btn.classList.add('copied'); setTimeout(()=>{btn.textContent=o;btn.classList.remove('copied');},1200); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>fb()); } else { fb(); }
  function fb(){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){prompt('複製 ID:',text);} document.body.removeChild(ta); }
}

// ============================================================
//  自動送出排程狀態/設定
//  ★ isWithinSchedule 的判斷邏輯要跟 muyo-shopee-autosend/send-worker.js
//    裡的同名函式保持一致,這裡只是給客服「預覽現在該不該運作」用,
//    實際擋不擋送出是腳本那邊自己再判斷一次。
// ============================================================
function isWithinSchedule(s, now){
  now = now || new Date();
  if(!s) return true;
  if(s.manual_pause) return false;
  const day = now.getDay();
  if(day===0 || day===6) return !!s.weekend_active;
  const toMin = t => { const [h,m] = String(t||'0:0').split(':').map(Number); return h*60+(m||0); };
  const cur = now.getHours()*60 + now.getMinutes();
  const start = toMin(s.weekday_start), end = toMin(s.weekday_end);
  if(start===end) return true;
  if(start<end) return cur>=start && cur<end;
  return cur>=start || cur<end;
}

function renderAutosendBadge(){
  const el = document.getElementById('asBadge');
  if(!el) return;
  const s = autosendSettings;
  if(!s){ el.className='as-badge off'; el.textContent='⚪ 尚未設定'; return; }

  if(s.manual_pause){ el.className='as-badge paused'; el.textContent='🔴 已手動暫停'; return; }

  const scheduledOn = isWithinSchedule(s);
  const heartbeatAgeMs = s.last_heartbeat_at ? (Date.now() - new Date(s.last_heartbeat_at).getTime()) : Infinity;
  const heartbeatStale = heartbeatAgeMs > 90*1000; // 超過 90 秒沒回報,視為腳本可能沒在跑

  if(!scheduledOn){ el.className='as-badge off'; el.textContent='⚪ 排程外,暫停中'; return; }
  if(heartbeatStale){ el.className='as-badge warn'; el.textContent='🟡 該運作但腳本沒回應,請檢查'; return; }
  el.className='as-badge on'; el.textContent='🟢 自動送出運作中';
}
setInterval(renderAutosendBadge, 5000); // 每 5 秒重畫一次狀態(不用等下次整個 loadAll)

function openAutosendModal(){
  const s = autosendSettings;
  document.getElementById('asWeekdayStart').value = (s && s.weekday_start) || '18:00';
  document.getElementById('asWeekdayEnd').value = (s && s.weekday_end) || '09:00';
  document.getElementById('asWeekendActive').checked = s ? !!s.weekend_active : true;
  document.getElementById('aiProvider').value = (s && s.ai_provider) || 'openai';
  document.getElementById('aiApiKey').value = (s && s.ai_api_key) || '';
  updateAiApplyLink();
  updatePauseBtn();
  document.getElementById('autosendModal').style.display = 'flex';
}
function closeAutosendModal(){ document.getElementById('autosendModal').style.display = 'none'; }

function updateAiApplyLink(){
  const provider = document.getElementById('aiProvider').value;
  const el = document.getElementById('aiApplyLink');
  if(provider === 'gemini'){
    el.innerHTML = '還沒有金鑰？<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">前往 Google AI Studio 申請</a>（申請後記得自己開通付費,免費額度很容易不夠用）';
  } else {
    el.innerHTML = '還沒有金鑰？<a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">前往 OpenAI 申請</a>（申請後記得自己到 Billing 開通付費）';
  }
}

function updatePauseBtn(){
  const btn = document.getElementById('asPauseBtn');
  const paused = autosendSettings ? !!autosendSettings.manual_pause : false;
  btn.textContent = paused ? '▶ 恢復自動送出' : '⏸ 立即暫停自動送出';
  btn.style.background = paused ? '#0F6E56' : '#A32D2D';
  btn.style.color = '#fff';
  btn.style.borderColor = paused ? '#0F6E56' : '#A32D2D';
}

async function toggleManualPause(){
  if(!autosendSettings){ alert('設定還沒載入,請稍後再試'); return; }
  const next = !autosendSettings.manual_pause;
  const { error } = await sb.from('autosend_settings').update({ manual_pause: next }).eq('id', autosendSettings.id);
  if(error){ alert('操作失敗:'+error.message); return; }
  autosendSettings.manual_pause = next;
  updatePauseBtn();
  renderAutosendBadge();
}

async function saveAutosendSettings(){
  if(!autosendSettings){ alert('設定還沒載入,請稍後再試'); return; }
  const weekday_start = document.getElementById('asWeekdayStart').value || '18:00';
  const weekday_end = document.getElementById('asWeekdayEnd').value || '09:00';
  const weekend_active = document.getElementById('asWeekendActive').checked;
  const ai_provider = document.getElementById('aiProvider').value;
  const ai_api_key = document.getElementById('aiApiKey').value.trim() || null;
  const { error } = await sb.from('autosend_settings')
    .update({ weekday_start, weekday_end, weekend_active, ai_provider, ai_api_key })
    .eq('id', autosendSettings.id);
  if(error){ alert('儲存失敗:'+error.message); return; }
  Object.assign(autosendSettings, { weekday_start, weekday_end, weekend_active, ai_provider, ai_api_key });
  renderAutosendBadge();
  closeAutosendModal();
}

// ============================================================
//  FAQ 管理:直接對 Supabase faqs 表做 CRUD,取代原本要另開一個
//  FAQ管理.html 網站的做法 —— 客服就在這個系統裡登入一次,兩件事都能做。
// ============================================================
function switchView(view){
  currentView = view;
  document.getElementById('convView').style.display = view === 'conv' ? 'block' : 'none';
  document.getElementById('faqView').style.display = view === 'faq' ? 'block' : 'none';
  if(view === 'faq'){ faqs.length ? renderFaqList() : loadFaqs(); }
}

async function loadFaqs(){
  const { data, error } = await sb.from('faqs').select('id,category,questions,answer')
    .eq('company_id', me.company_id).order('category');
  if(error){ alert('載入 FAQ 失敗:'+error.message); return; }
  faqs = data || [];
  renderFaqList();
}

function renderFaqList(){
  const kw = (document.getElementById('faqSearch').value || '').trim();
  let list = faqs;
  if(kw){
    list = faqs.filter(f =>
      (f.category||'').includes(kw) || (f.answer||'').includes(kw) || (f.questions||[]).some(q=>q.includes(kw))
    );
  }
  document.getElementById('faqCount').textContent = `${faqs.length} 筆` + (kw ? ` (符合 ${list.length})` : '');
  document.getElementById('faqList').innerHTML = list.map(faqCardHtml).join('')
    || '<div class="row" style="text-align:center;color:#aaa">找不到符合的 FAQ</div>';
}

function faqCardHtml(f){
  const qs = (f.questions||[]).join('\n');
  return `<div class="row faq-card" id="faq-card-${f.id}">
    <div class="top">
      <input class="cat" id="faq-cat-${f.id}" value="${esc(f.category||'')}" placeholder="分類">
      <span class="time">分類</span>
    </div>
    <label>客人問法(一行一個)</label>
    <textarea class="qbox" id="faq-q-${f.id}">${esc(qs)}</textarea>
    <label>標準回覆</label>
    <textarea class="abox" id="faq-a-${f.id}">${esc(f.answer||'')}</textarea>
    <div class="row-btns">
      <button class="mini primary" onclick="saveFaq('${f.id}')">儲存</button>
      <button class="mini" onclick="deleteFaq('${f.id}')">刪除</button>
      <span class="faq-saved" id="faq-saved-${f.id}"></span>
    </div>
  </div>`;
}

async function saveFaq(id){
  const category = document.getElementById('faq-cat-'+id).value.trim() || '一般';
  const questions = document.getElementById('faq-q-'+id).value.split('\n').map(s=>s.trim()).filter(Boolean);
  const answer = document.getElementById('faq-a-'+id).value;
  const savedEl = document.getElementById('faq-saved-'+id);
  savedEl.textContent = '儲存中…';
  if(String(id).startsWith('new-')){
    const { data, error } = await sb.from('faqs')
      .insert({ company_id: me.company_id, category, questions, answer }).select().single();
    if(error){ savedEl.textContent=''; alert('儲存失敗:'+error.message); return; }
    const i = faqs.findIndex(f=>f.id===id); if(i>=0) faqs[i]=data;
    // 重新渲染,把這張卡片換成正式 id 產生的按鈕/欄位,避免下次點儲存又誤判成新增、多出一筆重複資料
    renderFaqList();
    const newSavedEl = document.getElementById('faq-saved-'+data.id);
    if(newSavedEl){ newSavedEl.textContent = '✓ 已儲存'; setTimeout(()=>{ newSavedEl.textContent=''; }, 2000); }
    return;
  } else {
    const { error } = await sb.from('faqs').update({ category, questions, answer }).eq('id', id);
    if(error){ savedEl.textContent=''; alert('儲存失敗:'+error.message); return; }
    const f = faqs.find(x=>x.id===id); if(f){ f.category=category; f.questions=questions; f.answer=answer; }
  }
  savedEl.textContent = '✓ 已儲存';
  setTimeout(()=>{ savedEl.textContent=''; }, 2000);
}

async function deleteFaq(id){
  if(!confirm('確定刪除這題 FAQ？')) return;
  if(!String(id).startsWith('new-')){
    const { error } = await sb.from('faqs').delete().eq('id', id);
    if(error){ alert('刪除失敗:'+error.message); return; }
  }
  faqs = faqs.filter(f=>f.id!==id);
  renderFaqList();
}

function addNewFaq(){
  faqs.unshift({ id:'new-'+Date.now(), category:'一般', questions:[''], answer:'' });
  document.getElementById('faqSearch').value = '';
  renderFaqList();
  window.scrollTo({ top:0, behavior:'smooth' });
}

// 切回這個分頁時,立刻刷新一次(不用等 15 秒)
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && me && !isTyping() && !hasExpandedConv()){ loadAll(); }
});

// ---------- 啟動:檢查是否已登入 ----------
(async ()=>{
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await afterLogin(); } else { showLogin(); }
})();
</script>
